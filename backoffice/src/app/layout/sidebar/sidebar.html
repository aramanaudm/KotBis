<aside class="sidebar" [class.open]="open()">
  <div class="brand">
    <span class="brand-mark">
      <app-icon name="bus" />
    </span>
    <div class="brand-text">
      KotBis
      <small>{{ 'sidebar.backOffice' | t }}</small>
    </div>
    <button
      class="icon-button mobile-close"
      type="button"
      (click)="closeMenu()"
      [attr.aria-label]="'sidebar.closeMenu' | t"
    >
      <app-icon name="close" />
    </button>
  </div>

  <div class="nav-label">{{ 'sidebar.networkManagement' | t }}</div>

  <nav class="nav" [attr.aria-label]="'sidebar.mainNav' | t">
    @for (item of navItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        <app-icon [name]="item.icon" />
        <span>{{ item.label | t }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a class="traveler-link" href="/">
      <app-icon name="back" />
      <span>{{ 'sidebar.travelerInterface' | t }}</span>
    </a>
    <p>
      {{ 'sidebar.adminArea' | t }}<br />
      {{ 'sidebar.location' | t }}
    </p>
  </div>
</aside>

@if (open()) {
  <button
    class="backdrop"
    type="button"
    [attr.aria-label]="'sidebar.closeMenu' | t"
    (click)="closeMenu()"
  ></button>
}
