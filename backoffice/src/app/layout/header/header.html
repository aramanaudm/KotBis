<header class="app-header">
  <div class="header-left">
    <button
      class="icon-button menu-button"
      type="button"
      (click)="menuToggle.emit()"
      [attr.aria-label]="'header.openMenu' | t"
    >
      <app-icon name="menu" />
    </button>
    <span class="breadcrumb">
      {{ 'header.administration' | t }}
      <span class="separator">/</span>
      <b>{{ pageTitle() | t }}</b>
    </span>
  </div>

  <div class="header-actions">
    <select
      class="language-select"
      [attr.aria-label]="'header.language' | t"
      [value]="i18n.lang()"
      (change)="setLanguage($event)"
    >
      <option value="fr">FR</option>
      <option value="en">EN</option>
    </select>

    <button
      class="icon-button"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="(theme.isDark() ? 'header.lightTheme' : 'header.darkTheme') | t"
    >
      <app-icon [name]="theme.isDark() ? 'sun' : 'moon'" />
    </button>

    <span class="avatar" [attr.title]="session.currentUser().name">
      {{ session.currentUser().initials }}
    </span>
  </div>
</header>
