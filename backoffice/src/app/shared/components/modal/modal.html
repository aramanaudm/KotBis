<div class="overlay" (click)="onBackdrop($event)">
  <section class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title() | t">
    <div class="dialog-head">
      <h2>{{ title() | t }}</h2>
      <button
        class="icon-button"
        type="button"
        [attr.aria-label]="'common.close' | t"
        (click)="close.emit()"
      >
        <app-icon name="close" />
      </button>
    </div>

    <ng-content />
  </section>
</div>
