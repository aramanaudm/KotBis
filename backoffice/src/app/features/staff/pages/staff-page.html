<app-page-header
  title="Personnel"
  description="Gérez les agents et leurs rôles dans le back-office."
>
  <button class="primary" type="button" (click)="openCreate()">
    <app-icon name="plus" />
    Ajouter
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        placeholder="Rechercher…"
        aria-label="Rechercher un membre du personnel"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      aria-label="Filtrer par état"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">Tous les états</option>
      @for (status of statuses; track status) {
        <option [value]="status">{{ statusLabels[status] }}</option>
      }
    </select>

    <button class="secondary" type="button" (click)="exportCsv()">
      <app-icon name="export" />
      Exporter CSV
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    [showToggle]="true"
    toggleLabel="Activer / Désactiver"
    emptyMessage="Aucun membre ne correspond à la recherche."
    (toggle)="toggleStatus($event)"
    (edit)="openEdit($event)"
    (remove)="askDelete($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredStaff().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (formOpen()) {
  <app-modal [title]="formTitle()" (close)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <app-form-field
          label="Nom affiché"
          forId="staff-name"
          [error]="errorFor('name', 'Le nom est obligatoire.')"
        >
          <input id="staff-name" type="text" formControlName="name" maxlength="120" />
        </app-form-field>

        <app-form-field
          label="Email"
          forId="staff-email"
          [error]="errorFor('email', 'Saisissez une adresse email valide.')"
        >
          <input id="staff-email" type="email" formControlName="email" maxlength="254" />
        </app-form-field>

        <app-form-field label="Rôle" forId="staff-role">
          <select id="staff-role" formControlName="role">
            @for (role of roles; track role) {
              <option [value]="role">{{ roleLabels[role] }}</option>
            }
          </select>
        </app-form-field>

        <app-form-field label="État" forId="staff-status">
          <select id="staff-status" formControlName="status">
            @for (status of statuses; track status) {
              <option [value]="status">{{ statusLabels[status] }}</option>
            }
          </select>
        </app-form-field>

        <app-form-field label="Fonction" forId="staff-function">
          <input id="staff-function" type="text" formControlName="function" maxlength="100" />
        </app-form-field>
      </div>

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeForm()">Annuler</button>
        <button class="primary" type="submit" [disabled]="saving()">
          {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </app-modal>
}

@if (deleteTarget(); as member) {
  <app-modal title="Supprimer ce membre ?" (close)="cancelDelete()">
    <p>Le compte et le profil personnel de {{ member.name }} seront supprimés.</p>

    <div class="form-footer">
      <button class="secondary" type="button" (click)="cancelDelete()">Annuler</button>
      <button class="danger" type="button" (click)="confirmDelete()">Supprimer</button>
    </div>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
