<app-page-header title="staff.title" description="staff.description">
  <button class="primary" type="button" (click)="openCreate()">
    <app-icon name="plus" />
    {{ 'common.add' | t }}
  </button>
</app-page-header>

<p class="notice">{{ 'users.notice' | t }}</p>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        [placeholder]="'common.search' | t"
        [attr.aria-label]="'staff.search' | t"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      [attr.aria-label]="'common.filterState' | t"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">{{ 'common.allStates' | t }}</option>
      <option value="active">{{ 'status.staff.active' | t }}</option>
      <option value="inactive">{{ 'status.staff.inactive' | t }}</option>
    </select>

    <button class="secondary" type="button" (click)="exportCsv()">
      <app-icon name="export" />
      {{ 'common.exportCsv' | t }}
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    emptyMessage="staff.empty"
    (edit)="openEdit($event)"
    (remove)="askDelete($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredStaff().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (formOpen()) {
  <app-modal [title]="formTitle()" (close)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <app-form-field
          label="staff.field.name"
          forId="staff-name"
          [error]="errorFor('name', 'staff.error.name')"
        >
          <input id="staff-name" type="text" formControlName="name" maxlength="120" />
        </app-form-field>

        <app-form-field
          label="staff.field.email"
          forId="staff-email"
          [error]="errorFor('email', 'staff.error.email')"
        >
          <input id="staff-email" type="email" formControlName="email" maxlength="254" />
        </app-form-field>

        <app-form-field label="staff.field.role" forId="staff-role">
          <select id="staff-role" formControlName="role">
            <option value="operator">{{ 'role.operator' | t }}</option>
            <option value="moderator">{{ 'role.moderator' | t }}</option>
            <option value="admin">{{ 'role.admin' | t }}</option>
          </select>
        </app-form-field>

        <app-form-field label="staff.field.status" forId="staff-status">
          <select id="staff-status" formControlName="status">
            <option value="active">{{ 'status.staff.active' | t }}</option>
            <option value="inactive">{{ 'status.staff.inactive' | t }}</option>
          </select>
        </app-form-field>
      </div>

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeForm()">
          {{ 'common.cancel' | t }}
        </button>
        <button class="primary" type="submit">{{ 'common.save' | t }}</button>
      </div>
    </form>
  </app-modal>
}

@if (deleteTarget(); as member) {
  <app-modal title="staff.delete.title" (close)="cancelDelete()">
    <p>{{ 'staff.delete.message' | t: { name: member.name } }}</p>

    <div class="form-footer">
      <button class="secondary" type="button" (click)="cancelDelete()">
        {{ 'common.cancel' | t }}
      </button>
      <button class="danger" type="button" (click)="confirmDelete()">
        {{ 'common.delete' | t }}
      </button>
    </div>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
