<app-page-header title="Utilisateurs" description="Consultez les comptes voyageurs et les rôles associés.">
  <button class="primary" type="button" (click)="openCreate()">
    <app-icon name="plus" />
    Ajouter
  </button>
</app-page-header>

<p class="notice">
  Les rôles et permissions seront appliqués lors du branchement à l’authentification.
</p>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        placeholder="Rechercher…"
        aria-label="Rechercher un utilisateur"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      aria-label="Filtrer par état"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">Tous les états</option>
      <option value="active">Actif</option>
      <option value="inactive">Inactif</option>
    </select>

    <button class="secondary" type="button" (click)="exportCsv()">
      <app-icon name="export" />
      Exporter CSV
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    emptyMessage="Aucun utilisateur ne correspond à la recherche."
    (edit)="openEdit($event)"
    (remove)="askDelete($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredUsers().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (formOpen()) {
  <app-modal [title]="formTitle()" (close)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <app-form-field
          label="Pseudo"
          forId="user-pseudo"
          [error]="errorFor('pseudo', 'Le pseudo est obligatoire.')"
        >
          <input id="user-pseudo" type="text" formControlName="pseudo" maxlength="60" />
        </app-form-field>

        <app-form-field
          label="Email"
          forId="user-email"
          [error]="errorFor('email', 'Saisissez une adresse email valide.')"
        >
          <input id="user-email" type="email" formControlName="email" maxlength="254" />
        </app-form-field>

        <app-form-field label="Rôle" forId="user-role">
          <select id="user-role" formControlName="role">
            <option value="traveller">Voyageur</option>
            <option value="operator">Opérateur</option>
            <option value="moderator">Modérateur</option>
            <option value="admin">Administrateur</option>
          </select>
        </app-form-field>

        <app-form-field label="État" forId="user-status">
          <select id="user-status" formControlName="status">
            <option value="active">Actif</option>
            <option value="inactive">Inactif</option>
          </select>
        </app-form-field>
      </div>

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeForm()">Annuler</button>
        <button class="primary" type="submit">Enregistrer</button>
      </div>
    </form>
  </app-modal>
}

@if (deleteTarget(); as user) {
  <app-modal title="Supprimer cet utilisateur ?" (close)="cancelDelete()">
    <p>Le compte {{ user.pseudo }} sera retiré de la liste.</p>

    <div class="form-footer">
      <button class="secondary" type="button" (click)="cancelDelete()">Annuler</button>
      <button class="danger" type="button" (click)="confirmDelete()">Supprimer</button>
    </div>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
