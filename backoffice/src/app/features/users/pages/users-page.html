<app-page-header title="users.title" description="users.description">
  <button class="primary" type="button" (click)="openCreate()">
    <app-icon name="plus" />
    {{ 'common.add' | t }}
  </button>
</app-page-header>

<p class="notice">{{ 'users.notice' | t }}</p>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        [placeholder]="'common.search' | t"
        [attr.aria-label]="'users.search' | t"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      [attr.aria-label]="'common.filterState' | t"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">{{ 'common.allStates' | t }}</option>
      <option value="active">{{ 'status.user.active' | t }}</option>
      <option value="inactive">{{ 'status.user.inactive' | t }}</option>
    </select>

    <button class="secondary" type="button" (click)="exportCsv()">
      <app-icon name="export" />
      {{ 'common.exportCsv' | t }}
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    emptyMessage="users.empty"
    (edit)="openEdit($event)"
    (remove)="askDelete($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredUsers().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (formOpen()) {
  <app-modal [title]="formTitle()" (close)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <app-form-field
          label="users.field.pseudo"
          forId="user-pseudo"
          [error]="errorFor('pseudo', 'users.error.pseudo')"
        >
          <input id="user-pseudo" type="text" formControlName="pseudo" maxlength="60" />
        </app-form-field>

        <app-form-field
          label="users.field.email"
          forId="user-email"
          [error]="errorFor('email', 'users.error.email')"
        >
          <input id="user-email" type="email" formControlName="email" maxlength="254" />
        </app-form-field>

        <app-form-field label="users.field.role" forId="user-role">
          <select id="user-role" formControlName="role">
            <option value="traveller">{{ 'role.traveller' | t }}</option>
            <option value="operator">{{ 'role.operator' | t }}</option>
            <option value="moderator">{{ 'role.moderator' | t }}</option>
            <option value="admin">{{ 'role.admin' | t }}</option>
          </select>
        </app-form-field>

        <app-form-field label="users.field.status" forId="user-status">
          <select id="user-status" formControlName="status">
            <option value="active">{{ 'status.user.active' | t }}</option>
            <option value="inactive">{{ 'status.user.inactive' | t }}</option>
          </select>
        </app-form-field>
      </div>

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeForm()">
          {{ 'common.cancel' | t }}
        </button>
        <button class="primary" type="submit">{{ 'common.save' | t }}</button>
      </div>
    </form>
  </app-modal>
}

@if (deleteTarget(); as user) {
  <app-modal title="users.delete.title" (close)="cancelDelete()">
    <p>{{ 'users.delete.message' | t: { pseudo: user.pseudo } }}</p>

    <div class="form-footer">
      <button class="secondary" type="button" (click)="cancelDelete()">
        {{ 'common.cancel' | t }}
      </button>
      <button class="danger" type="button" (click)="confirmDelete()">
        {{ 'common.delete' | t }}
      </button>
    </div>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
