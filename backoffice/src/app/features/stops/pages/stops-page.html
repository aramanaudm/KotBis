<app-page-header title="stops.title" description="stops.description">
  <button class="primary" type="button" (click)="openCreate()">
    <app-icon name="plus" />
    {{ 'common.add' | t }}
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        [placeholder]="'common.search' | t"
        [attr.aria-label]="'stops.search' | t"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      [attr.aria-label]="'common.filterState' | t"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">{{ 'common.allStates' | t }}</option>
      <option value="active">{{ 'status.common.active' | t }}</option>
      <option value="inactive">{{ 'status.common.inactive' | t }}</option>
    </select>

    <button class="secondary" type="button" (click)="exportCsv()">
      <app-icon name="export" />
      {{ 'common.exportCsv' | t }}
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    emptyMessage="stops.empty"
    (edit)="openEdit($event)"
    (remove)="askDelete($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredStops().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (formOpen()) {
  <app-modal [title]="formTitle()" (close)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <app-form-field label="stops.field.name" forId="stop-name" [error]="nameError()">
          <input id="stop-name" type="text" formControlName="name" maxlength="150" />
        </app-form-field>

        <app-form-field label="stops.field.status" forId="stop-status">
          <select id="stop-status" formControlName="status">
            <option value="active">{{ 'status.common.active' | t }}</option>
            <option value="inactive">{{ 'status.common.inactive' | t }}</option>
          </select>
        </app-form-field>

        <app-form-field label="stops.field.latitude" forId="stop-latitude" [error]="latitudeError()">
          <input
            id="stop-latitude"
            type="number"
            step="any"
            min="-90"
            max="90"
            formControlName="latitude"
          />
        </app-form-field>

        <app-form-field
          label="stops.field.longitude"
          forId="stop-longitude"
          [error]="longitudeError()"
        >
          <input
            id="stop-longitude"
            type="number"
            step="any"
            min="-180"
            max="180"
            formControlName="longitude"
          />
        </app-form-field>
      </div>

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeForm()">
          {{ 'common.cancel' | t }}
        </button>
        <button class="primary" type="submit">{{ 'common.save' | t }}</button>
      </div>
    </form>
  </app-modal>
}

@if (deleteTarget(); as stop) {
  <app-modal title="stops.delete.title" (close)="cancelDelete()">
    <p>{{ 'stops.delete.message' | t: { name: stop.name } }}</p>

    <div class="form-footer">
      <button class="secondary" type="button" (click)="cancelDelete()">
        {{ 'common.cancel' | t }}
      </button>
      <button class="danger" type="button" (click)="confirmDelete()">
        {{ 'common.delete' | t }}
      </button>
    </div>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
