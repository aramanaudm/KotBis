<app-page-header title="Arrêts" description="Consultez et gérez les arrêts géolocalisés du réseau.">
  <button class="primary" type="button" (click)="openCreate()">
    <app-icon name="plus" />
    Ajouter
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        placeholder="Rechercher…"
        aria-label="Rechercher un arrêt"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      aria-label="Filtrer par état"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">Tous les états</option>
      <option value="active">Actif</option>
      <option value="inactive">Inactif</option>
    </select>

    <button class="secondary" type="button" (click)="exportCsv()">
      <app-icon name="export" />
      Exporter CSV
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    emptyMessage="Aucun arrêt ne correspond à la recherche."
    (edit)="openEdit($event)"
    (remove)="askDelete($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredStops().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (formOpen()) {
  <app-modal [title]="formTitle()" (close)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <app-form-field label="Nom" forId="stop-name" [error]="nameError()">
          <input id="stop-name" type="text" formControlName="name" maxlength="150" />
        </app-form-field>

        <app-form-field label="État" forId="stop-status">
          <select id="stop-status" formControlName="status">
            <option value="active">Actif</option>
            <option value="inactive">Inactif</option>
          </select>
        </app-form-field>

        <app-form-field label="Latitude" forId="stop-latitude" [error]="latitudeError()">
          <input
            id="stop-latitude"
            type="number"
            step="any"
            min="-90"
            max="90"
            formControlName="latitude"
          />
        </app-form-field>

        <app-form-field label="Longitude" forId="stop-longitude" [error]="longitudeError()">
          <input
            id="stop-longitude"
            type="number"
            step="any"
            min="-180"
            max="180"
            formControlName="longitude"
          />
        </app-form-field>
      </div>

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeForm()">Annuler</button>
        <button class="primary" type="submit">Enregistrer</button>
      </div>
    </form>
  </app-modal>
}

@if (deleteTarget(); as stop) {
  <app-modal title="Supprimer cet arrêt ?" (close)="cancelDelete()">
    <p>L’arrêt {{ stop.name }} sera retiré de la liste.</p>

    <div class="form-footer">
      <button class="secondary" type="button" (click)="cancelDelete()">Annuler</button>
      <button class="danger" type="button" (click)="confirmDelete()">Supprimer</button>
    </div>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
