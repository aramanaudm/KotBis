<app-page-header
  title="Signalements"
  description="Vérifiez les signalements envoyés par les voyageurs."
>
  <button class="secondary" type="button" (click)="exportCsv()">
    <app-icon name="export" />
    Exporter
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        placeholder="Rechercher…"
        aria-label="Rechercher un signalement"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      aria-label="Filtrer par statut"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">Tous les statuts</option>
      <option value="pending">À vérifier</option>
      <option value="confirmed">Confirmé</option>
      <option value="dismissed">Classé sans suite</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    [showRemove]="false"
    editLabel="Traiter le signalement"
    editIcon="check"
    emptyMessage="Aucun signalement ne correspond à la recherche."
    (edit)="openReview($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="total()"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (reviewTarget(); as report) {
  <app-modal title="Traiter le signalement" (close)="closeReview()">
    <div class="review-summary">
      <p class="review-reference">{{ report.id }} · {{ report.bus }}</p>
      <p class="review-comment">{{ report.comment }}</p>
      <p class="review-meta">{{ typeLabels[report.type] }} · {{ report.date }}</p>
    </div>

    <form (submit)="saveReview($event)">
      <app-form-field label="Statut" forId="report-status">
        <select id="report-status" [value]="reviewStatus()" (change)="onReviewStatus($event)">
          <option value="pending">À vérifier</option>
          <option value="confirmed">Confirmé</option>
          <option value="dismissed">Classé sans suite</option>
        </select>
      </app-form-field>

      <p class="review-hint">
        Confirmer ce signalement ne change pas automatiquement l’état du bus. Modifiez le bus après
        vérification.
      </p>

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeReview()">Annuler</button>
        <button class="primary" type="submit">Enregistrer</button>
      </div>
    </form>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
