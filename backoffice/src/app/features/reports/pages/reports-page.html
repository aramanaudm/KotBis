<app-page-header title="reports.title" description="reports.description">
  <button class="secondary" type="button" (click)="exportCsv()">
    <app-icon name="export" />
    {{ 'common.export' | t }}
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        [placeholder]="'common.search' | t"
        [attr.aria-label]="'reports.search' | t"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      [attr.aria-label]="'common.filterStatus' | t"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">{{ 'common.allStatuses' | t }}</option>
      <option value="pending">{{ 'status.report.pending' | t }}</option>
      <option value="confirmed">{{ 'status.report.confirmed' | t }}</option>
      <option value="dismissed">{{ 'status.report.dismissed' | t }}</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    [showRemove]="false"
    editLabel="reports.action.process"
    editIcon="check"
    emptyMessage="reports.empty"
    (edit)="openReview($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredReports().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (reviewTarget(); as report) {
  <app-modal title="reports.modal.title" (close)="closeReview()">
    <div class="review-summary">
      <p class="review-reference">{{ report.id }} · {{ report.bus }}</p>
      <p class="review-comment">{{ report.comment }}</p>
      <p class="review-meta">{{ typeKey(report.type) | t }} · {{ report.date }}</p>
    </div>

    <form (submit)="saveReview($event)">
      <app-form-field label="reports.field.status" forId="report-status">
        <select id="report-status" [value]="reviewStatus()" (change)="onReviewStatus($event)">
          <option value="pending">{{ 'status.report.pending' | t }}</option>
          <option value="confirmed">{{ 'status.report.confirmed' | t }}</option>
          <option value="dismissed">{{ 'status.report.dismissed' | t }}</option>
        </select>
      </app-form-field>

      <p class="review-hint">{{ 'reports.hint' | t }}</p>

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeReview()">
          {{ 'common.cancel' | t }}
        </button>
        <button class="primary" type="submit">{{ 'common.save' | t }}</button>
      </div>
    </form>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
