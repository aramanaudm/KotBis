<app-page-header title="buses.title" description="buses.description">
  <button class="primary" type="button" (click)="openCreate()">
    <app-icon name="plus" />
    {{ 'common.add' | t }}
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        [placeholder]="'common.search' | t"
        [attr.aria-label]="'buses.search' | t"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      [attr.aria-label]="'common.filterState' | t"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">{{ 'common.allStates' | t }}</option>
      <option value="active">{{ 'status.bus.active' | t }}</option>
      <option value="inactive">{{ 'status.bus.inactive' | t }}</option>
      <option value="breakdown">{{ 'status.bus.breakdown' | t }}</option>
    </select>

    <button class="secondary" type="button" (click)="exportCsv()">
      <app-icon name="export" />
      {{ 'common.exportCsv' | t }}
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    emptyMessage="buses.empty"
    (edit)="openEdit($event)"
    (remove)="askDelete($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredBuses().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (formOpen()) {
  <app-modal [title]="formTitle()" (close)="closeForm()">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <app-form-field
          label="buses.field.plate"
          forId="bus-plate"
          [error]="errorFor('plate', 'buses.error.plate')"
        >
          <input id="bus-plate" type="text" formControlName="plate" maxlength="25" />
        </app-form-field>

        <app-form-field label="buses.field.route" forId="bus-trajet">
          <select id="bus-trajet" formControlName="trajetCode">
            <option value="">{{ 'common.noRoute' | t }}</option>
            @for (route of availableRoutes(); track route.id) {
              <option [value]="route.code">
                {{ route.code }} · {{ route.line }} · {{ route.direction }}
              </option>
            }
          </select>
        </app-form-field>

        <app-form-field label="buses.field.line" forId="bus-line">
          <input id="bus-line" type="text" [value]="selectedRoute()?.line ?? '—'" readonly />
        </app-form-field>

        <app-form-field label="buses.field.direction" forId="bus-direction">
          <input id="bus-direction" type="text" [value]="selectedRoute()?.direction ?? '—'" readonly />
        </app-form-field>

        <app-form-field label="buses.field.status" forId="bus-status">
          <select id="bus-status" formControlName="status">
            <option value="active">{{ 'status.bus.active' | t }}</option>
            <option value="inactive">{{ 'status.bus.inactive' | t }}</option>
            <option value="breakdown">{{ 'status.bus.breakdown' | t }}</option>
          </select>
        </app-form-field>
      </div>

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeForm()">
          {{ 'common.cancel' | t }}
        </button>
        <button class="primary" type="submit">{{ 'common.save' | t }}</button>
      </div>
    </form>
  </app-modal>
}

@if (deleteTarget(); as bus) {
  <app-modal title="buses.delete.title" (close)="cancelDelete()">
    <p>{{ 'buses.delete.message' | t: { plate: bus.plate } }}</p>

    <div class="form-footer">
      <button class="secondary" type="button" (click)="cancelDelete()">
        {{ 'common.cancel' | t }}
      </button>
      <button class="danger" type="button" (click)="confirmDelete()">
        {{ 'common.delete' | t }}
      </button>
    </div>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
