<app-page-header title="reviews.title" description="reviews.description">
  <button class="secondary" type="button" (click)="exportCsv()">
    <app-icon name="export" />
    {{ 'common.export' | t }}
  </button>
</app-page-header>

<section class="card">
  <div class="toolbar">
    <label class="search">
      <app-icon name="search" />
      <input
        type="search"
        [placeholder]="'common.search' | t"
        [attr.aria-label]="'reviews.search' | t"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <select
      class="filter"
      [attr.aria-label]="'common.filterStatus' | t"
      [value]="statusFilter()"
      (change)="onFilter($event)"
    >
      <option value="">{{ 'common.allStatuses' | t }}</option>
      <option value="pending">{{ 'status.review.pending' | t }}</option>
      <option value="published">{{ 'status.review.published' | t }}</option>
      <option value="hidden">{{ 'status.review.hidden' | t }}</option>
    </select>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [statusTones]="statusTones"
    [showRemove]="false"
    editLabel="reviews.action.process"
    editIcon="check"
    emptyMessage="reviews.empty"
    (edit)="openReview($event)"
  />

  <app-pagination
    [page]="page()"
    [total]="filteredReviews().length"
    [pageSize]="pageSize"
    (pageChange)="changePage($event)"
  />
</section>

@if (reviewTarget(); as review) {
  <app-modal title="reviews.modal.title" (close)="closeReview()">
    <div class="review-summary">
      <p class="review-reference">{{ review.author }} · {{ review.route }}</p>
      <p class="review-comment">{{ review.comment }}</p>
    </div>

    <form (submit)="saveReview($event)">
      <app-form-field label="reviews.field.status" forId="review-status">
        <select id="review-status" [value]="reviewStatus()" (change)="onReviewStatus($event)">
          <option value="pending">{{ 'status.review.pending' | t }}</option>
          <option value="published">{{ 'status.review.published' | t }}</option>
          <option value="hidden">{{ 'status.review.hidden' | t }}</option>
        </select>
      </app-form-field>

      <div class="form-footer">
        <button class="secondary" type="button" (click)="closeReview()">
          {{ 'common.cancel' | t }}
        </button>
        <button class="primary" type="submit">{{ 'common.save' | t }}</button>
      </div>
    </form>
  </app-modal>
}

@if (feedback()) {
  <div class="toast" role="status">{{ feedback() }}</div>
}
