<main class="map-page" aria-label="Carte des bus à Maurice">
  <div #mapContainer class="map" aria-label="Carte interactive : utilisez les flèches pour vous déplacer"></div>
  <header class="floating-header">
    <div class="brand" aria-label="KotBis">
      <span class="brand-icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          focusable="false"
        >
          <rect x="5" y="3" width="14" height="16" rx="3" />
          <path d="M9 6h6" />
          <rect x="7.5" y="8" width="9" height="5" rx="1" />
          <path d="M3 9v4M21 9v4M7 19v2M17 19v2" />

          <circle
            cx="8.5"
            cy="16"
            r=".8"
            fill="#ffffff"
            stroke="none"
          />

          <circle
            cx="15.5"
            cy="16"
            r=".8"
            fill="#ffffff"
            stroke="none"
          />
        </svg>
      </span>

      <strong>KotBis</strong>
    </div>
    <button class="status account-access" type="button" (click)="mySpace()" aria-label="Ouvrir mon espace">
      <span class="visitor">{{ user()?.pseudo ?? 'Visiteur' }}</span>
      <span class="demo">Mon espace</span>
    </button>
  </header>
  @if (carteIndisponible()) {
    <div class="map-warning" role="alert">
      <span>Le fond de carte ne se charge pas complètement. Vérifiez votre connexion.</span>
      <button type="button" (click)="reessayer()">Réessayer</button>
    </div>
  }
  <nav class="map-controls" aria-label="Commandes de la carte">
    <button type="button" (click)="zoomer()" aria-label="Zoomer">+</button>
    <button type="button" (click)="dezoomer()" aria-label="Dézoomer">−</button>
    <button type="button" (click)="recentrer()" aria-label="Revenir à la vue de départ" title="Revenir à la vue de départ">◎</button>
  </nav>
  <section class="bottom-panel" aria-label="Informations de la carte">
    <div class="panel-handle" aria-hidden="true"></div>
    <button class="search-preview" type="button" disabled>
      <span aria-hidden="true">⌕</span><span>Où allez-vous ?</span><span class="arrow" aria-hidden="true">›</span>
    </button>
    <p class="preview-note">Recherche non disponible dans cette première étape.</p>
    <div class="panel-footer"><span>Bus à proximité</span><span>Marqueurs à ajouter</span></div>
  </section>
</main>
