<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Connexion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="logo" style="text-align: center; margin: 30px 0;">
    <ion-icon name="bus-outline" style="font-size: 48px; color: #10b981;"></ion-icon>
    <h2>Bus Maurice</h2>
  </div>

  <h1>Connectez-vous pour plus de fonctionnalités</h1>
  <p>Retrouvez vos trajets et vos préférences.</p>

  <ion-list>
    <ion-item>
      <ion-input label="Email ou pseudo" labelPlacement="stacked" placeholder="votre@email.com" type="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Mot de passe" labelPlacement="stacked" type="password" placeholder="Votre mot de passe"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="success" class="ion-margin-top">
    Se connecter
  </ion-button>

  <ion-button expand="block" fill="clear" routerLink="/register">
    Créer un compte
  </ion-button>

  <ion-button expand="block" fill="clear" routerLink="/tabs/home">
    Continuer en tant que visiteur →
  </ion-button>
</ion-content>
