<div class="destination-item">
  <div class="dest-icon" [class.star]="iconType === 'star'">
    <ion-icon [name]="icon"></ion-icon>
  </div>
  <div class="dest-info">
    <h4>{{ title }}</h4>
    <p>{{ subtitle }}</p>
  </div>
  <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
</div>
